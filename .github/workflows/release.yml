name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Test and build
        shell: powershell
        run: |
          .\build_release.ps1
          Copy-Item release\QuotaDock.exe release\QuotaDock-Windows-x64.exe

      - name: Publish release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $tag 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            gh release upload $tag release\QuotaDock-Windows-x64.exe --clobber
          } else {
            gh release create $tag release\QuotaDock-Windows-x64.exe --verify-tag --generate-notes --title "QuotaDock $tag"
          }
